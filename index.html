<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Thư viện kiến thức</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-2: #f8f9fa;
        --surface-hover: #f8f9fa;
        --ink: #202124;
        --ink-soft: #5f6368;
        --ink-faint: #80868b;
        --line: #dadce0;
        --line-soft: #e8eaed;
        --accent: #1a73e8;
        --accent-hover: #1765cc;
        --accent-soft: #e8f0fe;
        --accent-ink: #1967d2;
        --shadow-search: 0 1px 6px rgba(32,33,36,.18);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #202124;
          --surface: #202124;
          --surface-2: #292a2d;
          --surface-hover: #303134;
          --ink: #e8eaed;
          --ink-soft: #bdc1c6;
          --ink-faint: #9aa0a6;
          --line: #3c4043;
          --line-soft: #3c4043;
          --accent: #8ab4f8;
          --accent-hover: #aecbfa;
          --accent-soft: #303a4d;
          --accent-ink: #aecbfa;
          --shadow-search: 0 1px 6px rgba(0,0,0,.5);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Roboto", "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      button { font: inherit; cursor: pointer; }
      input { font: inherit; }
      img { max-width: 100%; }

      .layout {
        display: grid;
        grid-template-columns: 256px minmax(0, 1fr);
        max-width: 1280px;
        margin: 0 auto;
        min-height: 100vh;
      }

      /* ---------- Sidebar ---------- */
      .sidebar {
        border-right: 1px solid var(--line-soft);
        padding: 20px 12px 24px 16px;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }
      .brand {
        font-family: "Roboto", "Be Vietnam Pro", sans-serif;
        font-size: 22px;
        font-weight: 400;
        letter-spacing: -0.2px;
        color: var(--ink);
        margin: 4px 8px 24px;
        line-height: 1.2;
      }
      .brand span { color: var(--accent); font-weight: 500; }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        border-radius: 0 24px 24px 0;
        padding: 9px 14px 9px 12px;
        color: var(--ink-soft);
        font-size: 14px;
        font-weight: 400;
        margin: 1px 0;
      }
      .nav-item:hover { background: var(--surface-hover); color: var(--ink); }
      .nav-item.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 500; }
      .nav-item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--ink-faint)); flex: none; }
      .nav-item .count { margin-left: auto; font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
      .nav-item.active .count { color: var(--accent-ink); }
      .nav-item.sub { padding-left: 34px; font-size: 13.5px; border-radius: 0 20px 20px 0; }
      .nav-divider { border-top: 1px solid var(--line-soft); margin: 14px 8px; }

      /* ---------- Main ---------- */
      .main { padding: 24px 32px 72px; min-width: 0; max-width: 880px; width: 100%; margin: 0 auto; }
      .search {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 0 18px;
        height: 48px;
        margin-bottom: 8px;
        transition: box-shadow .15s ease, border-color .15s ease;
      }
      .search:hover { box-shadow: var(--shadow-search); border-color: transparent; }
      .search:focus-within { box-shadow: var(--shadow-search); border-color: transparent; }
      .search svg { flex: none; color: var(--ink-faint); }
      .search input { border: 0; outline: 0; background: none; color: var(--ink); width: 100%; padding: 0; font-size: 16px; font-family: inherit; }
      .search input::placeholder { color: var(--ink-faint); }
      .page-title {
        font-family: "Roboto", "Be Vietnam Pro", sans-serif;
        font-size: 22px;
        font-weight: 400;
        letter-spacing: -0.2px;
        color: var(--ink);
        margin: 18px 4px 4px;
      }

      /* ---------- Lists ---------- */
      .section { margin-top: 26px; }
      .section-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin: 0 4px 10px;
      }
      .section-title {
        font-family: "Roboto", "Be Vietnam Pro", sans-serif;
        font-size: 16px;
        font-weight: 500;
        color: var(--ink);
        margin: 0;
      }
      .section-count { font-size: 13px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
      .list { border: 1px solid var(--line-soft); border-radius: 8px; overflow: hidden; background: var(--surface); }
      .item {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        text-align: left;
        background: var(--surface);
        border: 0;
        border-bottom: 1px solid var(--line-soft);
        padding: 16px 18px;
        color: var(--ink);
      }
      .item:last-child { border-bottom: 0; }
      .item:hover { background: var(--surface-hover); }
      .item:hover .item-title { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
      .item .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
      .item-title {
        font-family: "Roboto", "Be Vietnam Pro", sans-serif;
        font-size: 16px;
        font-weight: 400;
        line-height: 1.45;
        letter-spacing: 0.1px;
      }
      .item-side { margin-left: auto; flex: none; font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .no-result { padding: 40px 16px 8px; text-align: center; color: var(--ink-faint); font-size: 14.5px; }

      /* ---------- Article page ---------- */
      .article-layout[hidden] { display: none; }
      .layout[hidden] { display: none; }
      .article-main-wrap { min-width: 0; width: 100%; }
      .article-topbar {
        max-width: 880px; margin: 0 auto; width: 100%;
        padding: 24px 32px 0;
        display: flex; align-items: center; gap: 10px;
      }
      .article-topbar .back-btn { margin-bottom: 0; }
      .menu-btn {
        display: none;
        align-items: center; justify-content: center;
        width: 40px; height: 40px; flex: none;
        background: var(--surface); border: 1px solid var(--line);
        border-radius: 50%; color: var(--ink-soft);
      }
      .menu-btn:hover { background: var(--surface-hover); color: var(--ink); }
      .sidebar-backdrop {
        position: fixed; inset: 0; z-index: 40;
        background: rgba(0,0,0,.45); border: 0; padding: 0; cursor: pointer;
      }
      .sidebar-backdrop[hidden] { display: none; }
      .article-page { max-width: 880px; margin: 0 auto; padding: 20px 32px 72px; width: 100%; }
      .back-btn {
        display: inline-flex; align-items: center; gap: 8px;
        background: var(--surface); border: 1px solid var(--line);
        border-radius: 20px; padding: 8px 16px 8px 12px;
        color: var(--ink-soft); font-size: 14px; font-weight: 500; font-family: inherit;
        margin-bottom: 28px;
      }
      .back-btn:hover { background: var(--surface-hover); color: var(--ink); }
      .back-btn svg { flex: none; }
      .article-cat { font-size: 13px; color: var(--accent-ink); display: flex; align-items: center; gap: 7px; font-weight: 500; }
      .article-cat .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
      .article-content h2 { font-family: "Roboto", "Be Vietnam Pro", sans-serif; font-size: 32px; font-weight: 400; line-height: 1.3; letter-spacing: -0.2px; margin: 12px 0 8px; color: var(--ink); }
      .article-meta { color: var(--ink-faint); font-size: 13px; padding-bottom: 18px; margin-bottom: 4px; border-bottom: 1px solid var(--line-soft); }
      .article-meta a { color: var(--accent); text-decoration: none; }
      .article-meta a:hover { text-decoration: underline; }
      .article-content h3 { font-family: "Roboto", "Be Vietnam Pro", sans-serif; font-size: 20px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--ink); margin: 34px 0 10px; }
      .article-content h3:first-of-type { margin-top: 24px; }
      .article-content h4.label { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); margin: 28px 0 8px; }
      .article-content p { margin: 0 0 10px; color: var(--ink-soft); font-size: 15.5px; line-height: 1.7; max-width: 720px; }
      .article-content p strong { color: var(--ink); font-weight: 500; }
      .def-block { margin: 0 0 6px; }
      figure.article-fig { margin: 16px 0 6px; max-width: 720px; }
      figure.article-fig img { width: 100%; height: auto; display: block; border: 1px solid var(--line-soft); border-radius: 8px; background: #fff; }
      figure.article-fig figcaption { font-size: 12.5px; color: var(--ink-faint); margin-top: 8px; }
      figure.article-fig figcaption a { color: var(--accent); text-decoration: none; }
      figure.article-fig figcaption a:hover { text-decoration: underline; }
      .status-picker { display: flex; flex-wrap: wrap; gap: 8px; }
      .status-btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); border-radius: 16px; padding: 7px 14px; font-size: 13px; font-weight: 500; font-family: inherit; }
      .status-btn:hover { background: var(--surface-hover); }
      .status-btn.active { border-color: transparent; background: var(--accent-soft); color: var(--accent-ink); font-weight: 500; }

      /* ---------- Mobile ---------- */
      .mobile-cats, .mobile-subcats { display: none; }
      @media (max-width: 820px) {
        .layout { grid-template-columns: 1fr; }
        .sidebar { display: none; }
        /* Article sidebar becomes a drawer on mobile */
        .article-layout .sidebar {
          display: block;
          position: fixed; top: 0; left: 0; z-index: 50;
          width: 280px; max-width: 85vw; height: 100dvh;
          background: var(--bg);
          border-right: 1px solid var(--line-soft);
          box-shadow: 0 1px 6px rgba(32,33,36,.28);
          transform: translateX(-105%);
          transition: transform .22s ease;
        }
        .article-layout .sidebar.open { transform: translateX(0); }
        .menu-btn { display: inline-flex; }
        .article-topbar { padding: 16px 16px 0; }
        .main { padding: 16px 16px 56px; }
        .mobile-brand { font-family: "Roboto", "Be Vietnam Pro", sans-serif; font-size: 22px; font-weight: 400; letter-spacing: -0.2px; margin: 4px 2px 16px; color: var(--ink); }
        .mobile-brand span { color: var(--accent); font-weight: 500; }
        .mobile-cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
        .mobile-subcats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
        .mobile-subcats:empty { display: none; }
        .chip { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft); border-radius: 16px; padding: 7px 14px; font-size: 13px; font-weight: 500; font-family: inherit; white-space: nowrap; }
        .chip.active { background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); font-weight: 500; }
        .item { padding: 15px 14px; }
        .item-title { font-size: 15.5px; }
        .search { height: 48px; border-radius: 24px; }
        .article-page { padding: 12px 16px 56px; }
        .article-content h2 { font-size: 26px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .article-layout .sidebar { transition: none; }
      }
      @media (min-width: 821px) { .mobile-brand { display: none; } }
    </style>
  </head>
  <body>
    <div class="layout" id="listView">
      <aside class="sidebar">
        <p class="brand">Thư viện <span>kiến thức</span></p>
        <div id="catNav"></div>
      </aside>

      <main class="main">
        <p class="mobile-brand">Thư viện <span>kiến thức</span></p>
        <div class="mobile-cats" id="mobileCats"></div>
        <div class="mobile-subcats" id="mobileSubcats"></div>

        <label class="search">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="searchInput" type="search" placeholder="Tìm kiếm…" autocomplete="off" aria-label="Tìm kiếm trong thư viện" />
        </label>

        <h1 class="page-title" id="pageTitle"></h1>
        <div id="sections"></div>
        <div class="no-result" id="noResult" hidden>Không có kết quả.</div>
      </main>
    </div>

    <div class="layout article-layout" id="articleView" hidden>
      <aside class="sidebar" id="articleSidebar">
        <p class="brand">Thư viện <span>kiến thức</span></p>
        <div id="catNavArticle"></div>
      </aside>
      <button class="sidebar-backdrop" id="articleBackdrop" type="button" hidden aria-label="Đóng danh mục"></button>
      <div class="article-main-wrap">
        <div class="article-topbar">
          <button class="menu-btn" id="articleMenuBtn" type="button" aria-label="Mở danh mục" aria-expanded="false" aria-controls="articleSidebar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
          </button>
          <button class="back-btn" id="backBtn" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
            Quay lại
          </button>
        </div>
        <main class="article-page">
          <article class="article-content" id="articleContent"></article>
        </main>
      </div>
    </div>

      var state = { view: "topics", query: "" };

      function fmtDate(iso) { if (!iso) return ""; var p = iso.split("-"); return p[2] + "/" + p[1]; }
      function fmtDateFull(iso) { if (!iso) return ""; var p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }
      function catById(id) {
        for (var i = 0; i < CATEGORIES.length; i++) if (CATEGORIES[i].id === id) return CATEGORIES[i];
        return null;
      }
      function topicHay(t) {
        var s = t.title + " " + (t.summary || "");
        (t.defs || []).forEach(function (df) { s += " " + df.term + " " + df.text; });
        (t.blocks || []).forEach(function (b) {
          s += " " + (b.heading || "") + " " + ((b.figure && b.figure.alt) || "");
        });
        return s.toLowerCase();
      }
      function matchesTopic(t) {
        var q = state.query.trim().toLowerCase();
        return !q || topicHay(t).indexOf(q) !== -1;
      }
      function matchesVocab(v) {
        var q = state.query.trim().toLowerCase();
        if (!q) return true;
        return (v.term + " " + v.meaning + " " + (v.example || "") + " " + (v.group || "")).toLowerCase().indexOf(q) !== -1;
      }

      function buildNav() {
        var html = "";
        html += '<button class="nav-item' + (state.view === "topics" || state.view.indexOf("cat:") === 0 ? " active" : "") + '" data-view="topics">' +
          '<span class="dot" style="--c:#1a73e8"></span>Topics' +
          '<span class="count">' + TOPICS.length + "</span></button>";
        CATEGORIES.forEach(function (c) {
          var n = TOPICS.filter(function (t) { return t.category === c.id; }).length;
          html += '<button class="nav-item sub' + (state.view === "cat:" + c.id ? " active" : "") + '" data-view="cat:' + c.id + '">' +
            '<span class="dot" style="--c:' + c.color + '"></span>' + esc(c.name) +
            '<span class="count">' + n + "</span></button>";
        });
        html += '<div class="nav-divider"></div>';
        html += '<button class="nav-item' + (state.view === "vocab" ? " active" : "") + '" data-view="vocab">' +
          '<span class="dot" style="--c:#188038"></span>Vocab library' +
          '<span class="count">' + VOCABS.length + "</span></button>";
        document.getElementById("catNav").innerHTML = html;
        var articleNav = document.getElementById("catNavArticle");
        if (articleNav) articleNav.innerHTML = html;

        var mobile = [
          { id: "topics", name: "Topics" },
          { id: "vocab", name: "Vocab library" }
        ];
        document.getElementById("mobileCats").innerHTML = mobile.map(function (v) {
          var active = v.id === "vocab" ? state.view === "vocab" : state.view !== "vocab";
          return '<button class="chip' + (active ? " active" : "") + '" data-view="' + v.id + '">' + esc(v.name) + "</button>";
        }).join("");

        var subHtml = "";
        if (state.view !== "vocab") {
          subHtml = '<button class="chip' + (state.view === "topics" ? " active" : "") + '" data-view="topics">Tất cả</button>' +
            CATEGORIES.map(function (c) {
              return '<button class="chip' + (state.view === "cat:" + c.id ? " active" : "") + '" data-view="cat:' + c.id + '">' + esc(c.name) + "</button>";
            }).join("");
        }
        document.getElementById("mobileSubcats").innerHTML = subHtml;

        var nodes = document.querySelectorAll("[data-view]");
        for (var i = 0; i < nodes.length; i++) {
          nodes[i].addEventListener("click", function () {
            state.view = this.getAttribute("data-view");
            closeArticleDrawer();
            if (!document.getElementById("articleView").hidden) {
              document.getElementById("articleView").hidden = true;
              document.getElementById("listView").hidden = false;
              window.scrollTo(0, 0);
            }
            render();
          });
        }
      }

      function closeArticleDrawer() {
        var sidebar = document.getElementById("articleSidebar");
        var backdrop = document.getElementById("articleBackdrop");
        var menuBtn = document.getElementById("articleMenuBtn");
        if (sidebar) sidebar.classList.remove("open");
        if (backdrop) backdrop.hidden = true;
        if (menuBtn) menuBtn.setAttribute("aria-expanded", "false");
      }
      function toggleArticleDrawer() {
        var sidebar = document.getElementById("articleSidebar");
        var backdrop = document.getElementById("articleBackdrop");
        var menuBtn = document.getElementById("articleMenuBtn");
        if (!sidebar) return;
        var willOpen = !sidebar.classList.contains("open");
        sidebar.classList.toggle("open", willOpen);
        if (backdrop) backdrop.hidden = !willOpen;
        if (menuBtn) menuBtn.setAttribute("aria-expanded", willOpen ? "true" : "false");
      }

      function topicListHtml(items) {
        return '<div class="list">' + items.map(function (t) {
          var c = catById(t.category);
          return '<button class="item" data-open-type="topic" data-open="' + t.id + '">' +
            '<span class="dot" style="--c:' + (c ? c.color : "#80868b") + '"></span>' +
            '<span class="item-title">' + esc(t.title) + "</span>" +
            '<span class="item-side">' + fmtDate(t.date) + "</span></button>";
        }).join("") + "</div>";
      }
      function vocabListHtml(items) {
        return '<div class="list">' + items.map(function (v) {
          return '<button class="item" data-open-type="vocab" data-open="' + v.id + '">' +
            '<span class="dot" style="--c:#188038"></span>' +
            '<span class="item-title">' + esc(v.term) + "</span>" +
            (v.group ? '<span class="item-side">' + esc(v.group) + "</span>" : "") + "</button>";
        }).join("") + "</div>";
      }

      function render() {
        buildNav();
        var titleEl = document.getElementById("pageTitle");
        var html = "";
        var total = 0;

        if (state.view === "vocab") {
          titleEl.textContent = "Vocab library";
          var vocabs = VOCABS.filter(matchesVocab)
            .sort(function (a, b) { return String(a.term).toLowerCase() < String(b.term).toLowerCase() ? -1 : 1; });
          total = vocabs.length;
          if (vocabs.length) html = '<section class="section">' + vocabListHtml(vocabs) + "</section>";
        } else if (state.view.indexOf("cat:") === 0) {
          var cat = catById(state.view.slice(4));
          titleEl.textContent = cat ? cat.name : "Topics";
          var inCat = TOPICS.filter(function (t) { return t.category === (cat && cat.id) && matchesTopic(t); })
            .sort(function (a, b) { return (a.date || "") > (b.date || "") ? -1 : 1; });
          total = inCat.length;
          if (inCat.length) html = '<section class="section">' + topicListHtml(inCat) + "</section>";
        } else {
          titleEl.textContent = "Topics";
          CATEGORIES.forEach(function (c) {
            var inCat = TOPICS.filter(function (t) { return t.category === c.id && matchesTopic(t); })
              .sort(function (a, b) { return (a.date || "") > (b.date || "") ? -1 : 1; });
            total += inCat.length;
            if (!inCat.length) return;
            html += '<section class="section"><div class="section-head"><h2 class="section-title">' + esc(c.name) + '</h2>' +
              '<span class="section-count">' + inCat.length + "</span></div>" + topicListHtml(inCat) + "</section>";
          });
        }

        document.getElementById("sections").innerHTML = html;
        document.getElementById("noResult").hidden = !(state.query.trim() && total === 0);

        var items = document.querySelectorAll("[data-open]");
        for (var i = 0; i < items.length; i++) {
          items[i].addEventListener("click", function () {
            openArticle(this.getAttribute("data-open-type"), this.getAttribute("data-open"));
          });
        }
      }

      var listScrollY = 0;

      function findItem(type, id) {
        var arr = type === "topic" ? TOPICS : VOCABS;
        for (var i = 0; i < arr.length; i++) if (String(arr[i].id) === String(id)) return arr[i];
        return null;
      }

      function openArticle(type, id) {
        var d = findItem(type, id);
        if (!d) return;
        var isTopic = type === "topic";
        var cat = isTopic ? catById(d.category) : null;
        var color = isTopic ? (cat ? cat.color : "#1a73e8") : "#188038";
        var catLabel = isTopic ? (cat ? cat.name : "Topics") : "Vocab library";
        var statusMap = VOCAB_STATUS;
        var content = document.getElementById("articleContent");
        var html =
          '<span class="article-cat"><span class="dot" style="--c:' + color + '"></span>' + esc(catLabel) + "</span>";
        if (isTopic) {
          html += "<h2>" + esc(d.title) + "</h2>" +
            '<div class="article-meta">' + fmtDateFull(d.date) +
              (d.source ? " · " + (d.sourceUrl ? '<a href="' + esc(d.sourceUrl) + '" target="_blank" rel="noopener">' + esc(d.source) + "</a>" : esc(d.source)) : "") + "</div>";
          (d.defs || []).forEach(function (df) {
            html += '<p class="def-block"><strong>' + esc(df.term) + ":</strong> " + esc(df.text) + "</p>";
          });
          // Nội dung chính
          var mainHtml = "";
          (d.blocks || []).forEach(function (b, bi) {
            mainHtml += "<h3>" + (bi + 1) + ". " + esc(b.heading) + "</h3>";
            if (b.figure) {
              mainHtml += '<figure class="article-fig"><img src="' + esc(b.figure.src) + '" alt="' + esc(b.figure.alt) + '" loading="lazy" />' +
                (b.figure.caption ? "<figcaption>" + (b.figure.captionUrl ? '<a href="' + esc(b.figure.captionUrl) + '" target="_blank" rel="noopener">' + esc(b.figure.caption) + "</a>" : esc(b.figure.caption)) + "</figcaption>" : "") +
                "</figure>";
            }
          });
          html += mainHtml;
        } else {
          html += "<h2>" + esc(d.term) + "</h2>" +
            (d.group ? '<div class="article-meta">' + esc(d.group) + "</div>" : "") +
            '<h4 class="label">Nghĩa</h4><p>' + esc(d.meaning) + "</p>" +
            (d.example ? '<h4 class="label">Ví dụ / cách dùng</h4><p>' + esc(d.example) + "</p>" : "");
        }
        if (!isTopic) {
          html += '<h4 class="label">Trạng thái</h4>' +
            '<div class="status-picker">' +
              Object.keys(statusMap).map(function (k) {
                return '<button class="status-btn' + (d.status === k ? " active" : "") + '" data-status="' + k + '">' + statusMap[k].label + "</button>";
              }).join("") +
            "</div>";
        }
        content.innerHTML = html;
        var btns = content.querySelectorAll("[data-status]");
        for (var i = 0; i < btns.length; i++) {
          btns[i].addEventListener("click", function () {
            d.status = this.getAttribute("data-status");
            openArticle(type, id);
            render();
          });
        }
        if (document.getElementById("articleView").hidden) {
          listScrollY = window.scrollY || 0;
        }
        closeArticleDrawer();
        document.getElementById("listView").hidden = true;
        document.getElementById("articleView").hidden = false;
        window.scrollTo(0, 0);
        var back = document.getElementById("backBtn");
        if (back) back.focus({ preventScroll: true });
      }
      function goBack() {
        if (document.getElementById("articleView").hidden) return;
        closeArticleDrawer();
        document.getElementById("articleView").hidden = true;
        document.getElementById("listView").hidden = false;
        window.scrollTo(0, listScrollY);
      }
      document.getElementById("backBtn").addEventListener("click", goBack);
      var menuBtnEl = document.getElementById("articleMenuBtn");
      if (menuBtnEl) menuBtnEl.addEventListener("click", toggleArticleDrawer);
      var backdropEl = document.getElementById("articleBackdrop");
      if (backdropEl) backdropEl.addEventListener("click", closeArticleDrawer);
      document.addEventListener("keydown", function (ev) {
        if (ev.key !== "Escape") return;
        var sidebar = document.getElementById("articleSidebar");
        if (sidebar && sidebar.classList.contains("open")) { closeArticleDrawer(); return; }
        goBack();
      });
      document.getElementById("searchInput").addEventListener("input", function () { state.query = this.value; render(); });

      render();
    </script>
  </body>
</html>
